name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate types from Avro schemas
        run: npm run generate:schemas

      - name: TypeScript type check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify dist files exist
        run: |
          test -f dist/index.js || (echo "dist/index.js missing" && exit 1)
          test -f dist/index.mjs || (echo "dist/index.mjs missing" && exit 1)
          test -f dist/index.d.ts || (echo "dist/index.d.ts missing" && exit 1)
          test -f dist/index.d.mts || (echo "dist/index.d.mts missing" && exit 1)
          echo "✅ All dist files present"

      - name: Prepare artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-node-${{ matrix.node-version }}
          path: |
            dist/
            schemas/

  publish-rc:
    name: Publish RC to GitHub Packages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          cache: 'npm'
          scope: '@ps4on1k'

      - name: Install dependencies
        run: npm ci

      - name: Set RC version
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          RC_VERSION="${CURRENT_VERSION}-rc.${SHORT_SHA}.${GITHUB_RUN_NUMBER}"
          echo "version=${RC_VERSION}" >> "$GITHUB_OUTPUT"
          echo "📦 RC version: ${RC_VERSION}"

      - name: Update package version to RC
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Build package
        run: npm run build

      - name: Publish RC to GitHub Packages
        run: npm publish --tag rc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
